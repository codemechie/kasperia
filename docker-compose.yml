services:
  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - kasperia-net
    restart: unless-stopped

  kasperia:
    build: .
    ports:
      - "8000:8000"
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434/v1
      - OLLAMA_API_KEY=ollama
      - LLM_MODEL=deepseek-r1:8b
      - MCP_HOST=0.0.0.0
      - MCP_PORT=8000
    depends_on:
      - ollama
    networks:
      - kasperia-net
    restart: unless-stopped

volumes:
  ollama_data:

networks:
  kasperia-net:
